version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  # docs-site is not in the pnpm workspace yet. TODO(M0-13): remove this entry once docs-site
  # joins the workspace and the root entry covers it.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      docs-site-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
