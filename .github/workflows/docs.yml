name: docs

on:
  pull_request:
    paths:
      [
        'docs/**',
        'docs-site/**',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        '.github/workflows/docs.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'docs/**',
        'docs-site/**',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        '.github/workflows/docs.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm version comes from `packageManager` in package.json; a `version:` input that
      # differs from it makes action-setup fail.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # project-ci installs with PUPPETEER_SKIP_DOWNLOAD and shares the pnpm store cache, so on a
      # cache hit puppeteer counts as built and its Chrome download never runs. mermaid-cli needs it.
      - run: pnpm rebuild puppeteer
      - run: pnpm test
      - run: pnpm check:mermaid
      - run: pnpm build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
      # Offline check of every internal link and #anchor in out/ (scripts/check-links.mjs).
      - run: pnpm check:links
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs-site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
