name: docs

# Manual only until M0-13 adds the lockfile and enables GitHub Pages.
# M0-13: restore the pull_request / push triggers below and delete workflow_dispatch-only.
#   pull_request:
#     paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
#   push:
#     branches: [main]
#     paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      # TODO(M0-04): pin all actions by full commit SHA
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mermaid
      - run: pnpm build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
      # TODO(M0-13): add an offline internal-link check on out/ (e.g. lychee with --root-dir)
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs-site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
