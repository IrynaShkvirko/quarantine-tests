name: docs

# Manual only until M0-13 adds the lockfile and enables GitHub Pages.
# M0-13: restore the pull_request / push triggers below and delete workflow_dispatch-only.
#   pull_request:
#     paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
#   push:
#     branches: [main]
#     paths: ['docs/**', 'docs-site/**', '.github/workflows/docs.yml']
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm version comes from `packageManager` in package.json; a `version:` input that
      # differs from it makes action-setup fail.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mermaid
      - run: pnpm build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
      # TODO(M0-13): add an offline internal-link check on out/ (e.g. lychee with --root-dir)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs-site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
