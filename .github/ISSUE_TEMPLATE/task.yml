name: Task
description: A unit of implementation work (about one day or less, one PR).
title: '[Mx-xx] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Title format: `[M1-03] Short name`. Rules for agents and people: `CLAUDE.md`.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists and what a reader needs to know before starting.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Numbered steps, with file paths and names.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this task does not do, and which task does.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: A checkbox list. Each item must be checkable with a test, a command or a file.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Which tests prove it works (domain logic test-first, golden files, integration).
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issue links or task IDs, or "none".
      placeholder: '#12, M0-01'
    validations:
      required: true
  - type: input
    id: doc-refs
    attributes:
      label: Doc refs
      description: Spec sections and docs to read first.
      placeholder: 'docs/architecture.md §3.4'
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: Tasks bigger than 1 day need a plan in `docs/plans/` first.
      options:
        - 0.5 day
        - 1 day
        - 2 days
        - 3+ days (split it)
    validations:
      required: true
