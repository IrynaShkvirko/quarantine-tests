apiVersion: 1

datasources:
  - name: fq-postgres
    uid: fq-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro
    isDefault: true
    editable: false
    jsonData:
      database: fq
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_RO_PASSWORD
