[project]
name = "fq-backend"
version = "0.0.0"
description = "Flaky Test Quarantine backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "procrastinate>=3.12.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "ruamel-yaml>=0.18",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
fq-admin = "app.admin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
