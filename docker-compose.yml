name: fq

x-backend: &backend
  image: fq-backend:dev
  build:
    context: .
    dockerfile: backend/Dockerfile

x-backend-env: &backend-env
  FQ_DATABASE_URL: postgresql+psycopg://fq:${POSTGRES_PASSWORD}@db:5432/fq
  FQ_LOG_LEVEL: ${FQ_LOG_LEVEL:-INFO}
  FQ_ENV: ${FQ_ENV:-local}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fq
      POSTGRES_DB: fq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - '127.0.0.1:${FQ_DB_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fq -d fq']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ['migrate']
    environment:
      <<: *backend-env
      FQ_MIGRATE_TEST_DB: '1'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      disable: true

  api:
    <<: *backend
    command: ['api']
    environment:
      <<: *backend-env
      FQ_API_RELOAD: '1'
    volumes:
      - ./backend/app:/app/backend/app:ro
    ports:
      - '127.0.0.1:${FQ_API_HOST_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: ['worker']
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

  grafana:
    image: grafana/grafana-oss:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?copy .env.example to .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health | grep -q ''"database": "ok"''']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
